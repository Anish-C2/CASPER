:root{--sector-gap:18px}.sector-wrap{max-width:1180px;margin:0 auto;padding:28px 22px 56px;font-family:"Inter Tight","Segoe UI",sans-serif}.sector-wrap *{font-family:inherit}.sector-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.sector-kicker{font-size:12px;letter-spacing:.14em;opacity:.65;font-weight:700}.sector-title{font-size:42px;line-height:1;margin:7px 0}.sector-desc{max-width:720px;opacity:.72;margin:0}.sector-back{display:inline-flex;padding:9px 13px;border:1px solid rgba(127,127,127,.25);border-radius:10px;text-decoration:none}.sector-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.sector-stat,.sector-card{border:1px solid rgba(127,127,127,.2);border-radius:14px;padding:16px;background:rgba(127,127,127,.035)}.sector-stat b{display:block;font-size:25px}.sector-stat span{font-size:11px;letter-spacing:.1em;opacity:.6}.sector-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:var(--sector-gap)}.sector-card{margin-bottom:var(--sector-gap)}.sector-card h3{margin:0 0 13px;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.sector-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.13);align-items:center}.sector-row:last-child{border-bottom:0}.sector-muted{opacity:.58;font-size:13px}.sector-pill{font-size:11px;padding:4px 7px;border-radius:999px;background:rgba(127,127,127,.1)}.sector-score{font-weight:800;white-space:nowrap}.sector-clubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.sector-club{padding:11px 12px;border:1px solid rgba(127,127,127,.15);border-radius:10px}.sector-club b{display:block}.sector-club span{font-size:11px;opacity:.6}.sector-league{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(127,127,127,.13)}.sector-league:last-child{border-bottom:0}.sector-table{width:100%;border-collapse:collapse}.sector-table t
