        <td class="match-score">${om.sh}–${om.sa}</td>
      </tr>`;
        });
        html += `</tbody></table></div>`;
      }
      return html;
    }

    function renderSeason(param) {
      const season = decodeURIComponent(param);
      const tours = STATE.tournaments.filter(t => t.meta.s === season);
      if (!tours.length) return `<div class="error">Season “${escapeHtml(season)}” not found.</div>`;
      const matchList = STATE.matches.filter(m => m.season === season);
      const goals = matchList.reduce((s, m) => s + m.sh + m.sa, 0);
      const players = {};
      matchList.forEach(m => {
        if (m.homePlayer) {
          if (!players[m.homePlayer]) players[m.homePlayer] = { name: m.homePlayer, g: 0, m: 0, w: 0, cs: 0 };
          players[m.homePlayer].g += m.sh; players[m.homePlayer].m++;
          if (m.homeWin) players[m.homePlayer].w++;
          if (m.sa === 0) players[m.homePlayer].cs++;
        }
        if (m.awayPlayer) {
          if (!players[m.awayPlayer]) players[m.awayPlayer] = { name: m.awayPlayer, g: 0, m: 0, w: 0, cs: 0 };
          players[m.awayPlayer].g += m.sa; players[m.awayPlayer].m++;
          if (m.awayWin) players[m.awayPlayer].w++;
          if (m.sh === 0) players[m.awayPlayer].cs++;
        }
      });
      const plist = Object.values(players).sort((a, b) => b.g - a.g);
      const note = (STATE.misc.seasonNotes && STATE.misc.seasonNotes[season]) || '';
      const sa = (STATE.misc.seasonalAwards || []).filter(a => a.season === season);

      let html = `<a class="back" href="#archive"><i class="fa-solid fa-arrow-left"></i> Archive</a>
  <h1><i class="fa-solid fa-calendar i"></i>Season ${escapeHtml(season)}</h1>
  ${note ? `<p class="muted">${escapeHtml(note)}</p>` : ''}
  <div class="mega-strip">
    <div class="cell"><span class="n">${tours.length}</span><span class="l">Competitions</span></div>
    <div class="cell"><span class="n">${matchList.length}</span><span class="l">Matches</span></div>
    <div class="cell"><span class="n">${goals}</span><span class="l">Goals</span></div>
    <div class="cell"><span class="n">${matchList.length ? (goals / matchList.length).toFixed(2) : '—'}</span><span class="l">G/M</span></div>
    <div class="cell"><span class="n">${plist.length}</span><span class="l">Players</span></div>
    <div class="cell"><span class="n">${sa.length}</span><span class="l">Season awards</span></div>
    <div class="cell"><span class="n">${matchList.filter(m => m.sa === 0 || m.sh === 0).length}</span><span class="l">CS matches</span></div>
    <div class="cell"><span class="n">${matchList.filter(m => m.p).length}</span><span class="l">Penalties</span></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="section-title"><i class="fa-solid fa-trophy i"></i>Competitions</div>
      <table><thead><tr><th>Event</th><th>Fmt</th><th>Teams</th><th>Matches</th><th>Champion</th><th>Status</th></tr></thead><tbody>`;
      tours.forEach(t => {
        const ch = t.aw.ch ? ((STATE.teams[t.aw.ch] || {}).name || t.aw.ch) : '—';
        html += `<tr>
      <td><a href="#competition/${encodeURIComponent(t.meta.id)}">${escapeHtml(t.meta.e || t.meta.id)}</a></td>
      <td>${escapeHtml(t.meta.fmt || '')}</td>
      <td>${Object.keys(t.n).length}</td>
      <td>${t.m.length}</td>
      <td>${escapeHtml(ch)}</td>
      <td>${statusBadge(t)}</td>
    </tr>`;
      });
      html += `</tbody></table></div>
    <div class="panel">
      <div class="section-title"><i class="fa-solid fa-fire i"></i>Season scorers</div>
      <table><thead><tr><th>#</th><th>Player</th><th>G</th><th>M</th><th>CS</th><th>W</th></tr></thead><tbody>`;
      plist.slice(0, 15).forEach((p, i) => {
        html += `<tr><td>${i + 1}</td><td><a href="#player/${encodeURIComponent(p.name)}">${escapeHtml(p.name)}</a></td>
      <td><b>${p.g}</b></td><td>${p.m}</td><td>${p.cs}</td><td>${p.w}</td></tr>`;
      });
      html += `</tbody></table></div>
  </div>`;

      if (sa.length) {
        html += `<div class="panel"><div class="section-title"><i class="fa-solid fa-award i"></i>Seasonal awards</div>
    <table><thead><tr><th>Award</th><th>Recipient</th><th>Note</th></tr></thead><tbody>`;
        sa.forEach(a => {
          html += `<tr><td class="accent">${escapeHtml(a.award || '')}</td>
        <td><a href="#player/${encodeURIComponent(a.recipient)}">${escapeHtml(a.recipient)}</a></td>
        <td class="muted">${escapeHtml(a.note || '')}</td></tr>`;
        });
        html += `</tbody></table></div>`;
      }

      html += `<div class="panel"><div class="section-title"><i class="fa-solid fa-futbol i"></i>All matches (${matchList.length})</div>
  <table><thead><tr><th>Competition</th><th>Stage</th><th>Match</th><th>Score</th><th></th></tr></thead><tbody>`;
      matchList.forEach(m => {
        html += `<tr>
      <td><a href="#competition/${encodeURIComponent(m.tourneyId)}">${escapeHtml(m.event || m.tourneyId)}</a></td>
      <td>${m.stage ? `<span class="stage-tag">${escapeHtml(m.stage)}</span>` : '—'}</td>
      <td>${escapeHtml(m.homeName)} – ${escapeHtml(m.awayName)}</td>
      <td class="match-score">${m.sh}–${m.sa}</td>
      <td><a href="#match/${encodeURIComponent(m.id)}">View</a></td>
    </tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    function renderSeries(param) {
      // Official competition series by event name
      const name = decodeURIComponent(param);
      const tours = STATE.tournaments.filter(t => (t.meta.e || '') === name || (t.meta.id || '') === name);
      if (!tours.length) {
        // try case-insensitive
        const low = name.toLowerCase();
        const tours2 = STATE.tournaments.filter(t => (t.meta.e || '').toLowerCase() === low);
        if (!tours2.length) return `<div class="error">Competition series “${escapeHtml(name)}” not found.</div>`;
        return renderSeriesInner(name, tours2);
      }
      return renderSeriesInner(name, tours);
    }
    function renderSeriesInner(name, tours) {
      tours = sortByDate(tours, false);
      const matchList = [];
      tours.forEach(t => {
        STATE.matches.filter(m => m.tourneyId === t.meta.id).forEach(m => matchList.push(m));
      });
      const goals = matchList.reduce((s, m) => s + m.sh + m.sa, 0);
      const champions = {};
      tours.forEach(t => {
        if (t.aw.ch) {
          const n = (STATE.teams[t.aw.ch] || {}).name || t.aw.ch;
          champions[n] = (champions[n] || 0) + 1;
        }
      });
      let html = `<a class="back" href="#competitions"><i class="fa-solid fa-arrow-left"></i> Competitions</a>
  <h1><i class="fa-solid fa-trophy i"></i>${escapeHtml(name)}</h1>
  <p class="muted">Official competition series · ${tours.length} edition(s)</p>
  <div class="mega-strip">
    <div class="cell"><span class="n">${tours.length}</span><span class="l">Editions</span></div>
    <div class="cell"><span class="n">${matchList.length}</span><span class="l">Matches</span></div>
    <div class="cell"><span class="n">${goals}</span><span class="l">Goals</span></div>
    <div class="cell"><span class="n">${matchList.length ? (goals / matchList.length).toFixed(2) : '—'}</span><span class="l">G/M</span></div>
    <div class="cell"><span class="n">${Object.keys(champions).length}</span><span class="l">Unique champions</span></div>
    <div class="cell"><span class="n">${matchList.filter(m => m.p).length}</span><span class="l">Penalties</span></div>
    <div class="cell"><span class="n">${matchList.filter(m => m.sa === 0 || m.sh === 0).length}</span><span class="l">CS matches</span></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="section-title"><i class="fa-solid fa-list-ol i"></i>Editions</div>
      <table><thead><tr><th>Season</th><th>ID</th><th>Teams</th><th>Matches</th><th>Champion</th><th>Status</th></tr></thead><tbody>`;
      tours.forEach(t => {
        const ch = t.aw.ch ? ((STATE.teams[t.aw.ch] || {}).name || t.aw.ch) : '—';
        html += `<tr>
      <td><a href="#season/${encodeURIComponent(t.meta.s || '')}">${escapeHtml(t.meta.s || '')}</a></td>
      <td><a href="#competition/${encodeURIComponent(t.meta.id)}">${escapeHtml(t.meta.id)}</a></td>
      <td>${Object.keys(t.n).length}</td>
      <td>${t.m.length}</td>
      <td>${escapeHtml(ch)}</td>
      <td>${statusBadge(t)}</td>
    </tr>`;
      });
      html += `</tbody></table></div>
    <div class="panel">
      <div class="section-title"><i class="fa-solid fa-crown i"></i>Honours</div>
      <table><thead><tr><th>Champion</th><th>Titles</th></tr></thead><tbody>`;
      Object.entries(champions).sort((a, b) => b[1] - a[1]).forEach(([n, c]) => {
        html += `<tr><td>${escapeHtml(n)}</td><td><b>${c}</b></td></tr>`;
      });
      if (!Object.keys(champions).length) html += `<tr><td colspan="2" class="muted">None yet</td></tr>`;
      html += `</tbody></table></div>
  </div>`;
      return html;
    }

    function renderCompetitionsOfficial() {
      // Group tournaments by event name (series)
      const series = {};
      STATE.tournaments.forEach(t => {
        const name = t.meta.e || t.meta.id;
        if (!series[name]) series[name] = [];
        series[name].push(t);
      });
      // Also list pyramid trophies as official competitions
      const pyr = (STATE.misc.pyramid && STATE.misc.pyramid.trophies) || [];
      let html = `<h1><i class="fa-solid fa-trophy i"></i>Competitions</h1>
  <p class="muted">Official competition series in the archive and pyramid.</p>
  <div class="mega-strip">
    <div class="cell"><span class="n">${Object.keys(series).length}</span><span class="l">Series</span></div>
    <div class="cell"><span class="n">${STATE.tournaments.length}</span><span class="l">Editions</span></div>
    <div class="cell"><span class="n">${STATE.matches.length}</span><span class="l">Matches</span></div>
    <div class="cell"><span class="n">${pyr.length}</span><span class="l">Pyramid trophies</span></div>
  </div>
  <div class="panel">
    <div class="section-title"><i class="fa-solid fa-folder-open i"></i>Archive series</div>
    <table><thead><tr><th>Competition</th><th>Editions</th><th>Seasons</th><th>Matches</th><th>Latest champion</th></tr></thead><tbody>`;
      Object.entries(series).sort((a, b) => b[1].length - a[1].length).forEach(([name, list]) => {
        const sorted = sortByDate(list, true);
        const latest = sorted[0];
        const ch = latest && latest.aw.ch ? ((STATE.teams[latest.aw.ch] || {}).name || latest.aw.ch) : '—';
        const seasons = [...new Set(list.map(t => t.meta.s).filter(Boolean))].join(', ');
        const matches = list.reduce((s, t) => s + t.m.length, 0);
        html += `<tr>
      <td><a href="#series/${encodeURIComponent(name)}"><b>${escapeHtml(name)}</b></a></td>
      <td>${list.length}</td>
      <td>${escapeHtml(seasons)}</td>
      <td>${matches}</td>
      <td>${escapeHtml(ch)}</td>
    </tr>`;
      });
      html += `</tbody></table></div>`;

      if (pyr.length) {
        html += `<div class="panel"><div class="section-title"><i class="fa-solid fa-diagram-project i"></i>Pyramid trophies</div>
    <div class="pyr-trophies">`;
        pyr.forEach(t => {
          html += `<div class="pyr-trophy ${escapeHtml(t.level || '')}">
        <div class="t-name">${escapeHtml(t.name)}</div>
        <div class="t-note">${escapeHtml(t.note || '')}</div>
      </div>`;
        });
        html += `</div>
    <div style="margin-top:10px">${renderPyramid()}</div>
    </div>`;
      }

      // Seasons index
      const seasons = [...new Set(STATE.tournaments.map(t => t.meta.s).filter(Boolean))].sort().reverse();
      html += `<div class="panel"><div class="section-title"><i class="fa-solid fa-calendar i"></i>Seasons</div>
  <table><thead><tr><th>Season</th><th>Competitions</th><th>Matches</th><th>Goals</th></tr></thead><tbody>`;
      seasons.forEach(s => {
        const st = STATE.tournaments.filter(t => t.meta.s === s);
        const ms = STATE.matches.filter(m => m.season === s);
        const g = ms.reduce((a, m) => a + m.sh + m.sa, 0);
        html += `<tr>
      <td><a href="#season/${encodeURIComponent(s)}"><b>${escapeHtml(s)}</b></a></td>
      <td>${st.length}</td><td>${ms.length}</td><td>${g}</td>
    </tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }


    function route() {
      if (!STATE.ready) return;
      const hash = (location.hash || '#home').slice(1);
      const [view, ...rest] = hash.split('/');
      const param = rest.join('/');

      setActiveNav(
        view === 'competition' || view === 'match' ? 'archive' :
          view === 'series' || view === 'season' ? 'competitions' :
            view === 'player' ? 'players' :
              view === 'team' ? 'teams' :
                view
      );

      const app = document.getElementById('app');
      const renderStart = performance.now();
      let html = '';
      switch (view) {
        case 'home': html = renderHome(); break;
        case 'news': html = renderNews(); break;
        case 'structure': html = renderStructure(); break;
        case 'archive': html = renderArchive(); break;
        case 'competitions': html = renderCompetitions(); break;
        case 'competition': html = renderCompetition(param); break;
        case 'series': html = renderSeries(param); break;
        case 'season': html = renderSeason(param); break;
        case 'match': html = renderMatch(param); break;
        case 'players': html = renderPlayers(); break;
        case 'player': html = renderPlayer(param); break;
        case 'teams': html = renderTeams(); break;
        case 'team': html = renderTeam(param); break;
        case 'awards': html = renderAwards(); break;
        case 'records': html = renderRecords(); break;
        case 'statistics': html = renderStatistics(); break;
        case 'database': html = renderDatabase(); break;
        case 'search': html = renderSearch(); break;
        case 'about': html = renderAbout(); break;
        default: html = renderHome();
      }
      app.innerHTML = html;
      STATE.metrics.renderTimeMs = +(performance.now() - renderStart).toFixed(1);

      if (view === 'search') {
        const input = document.getElementById('search-input');
        if (input) {
          input.focus();
          input.addEventListener('input', () => doSearch(input.value));
        }
      }
    }

    /* ---------- BOOT ---------- */
    function extractRawBlocks(text) {
      const blocks = {};
      // Match each [...] tournament block that starts with id=
      const re = /\[\s*id\s*=\s*([^;]+);[\s\S]*?\]/gi;
      let m;
      while ((m = re.exec(text)) !== null) {
        blocks[m[1].trim()] = m[0].trim();
      }
      return blocks;
    }

    async function loadAllArchives(config) {
      const allTournaments = [];
      const sources = [];
      const rawById = {};
      let totalChars = 0, totalBytes = 0, totalLines = 0;
      const parseStart = performance.now();

      function ingest(text, path) {
        totalChars += text.length;
        totalBytes += new Blob([text]).size;
        totalLines += text.split('\n').length;
        const parsed = parseCSN(text);
        const blocks = extractRawBlocks(text);
        parsed.forEach(t => {
          t._source = path;
          if (t.meta && t.meta.id && blocks[t.meta.id]) {
            rawById[t.meta.id] = blocks[t.meta.id];
          }
        });
        allTournaments.push(...parsed);
        sources.push(path);
      }

      const manifestPath = (config.archives && config.archives.manifest) || 'data/manifest.json';
      try {
        const manRes = await fetch(manifestPath);
        if (manRes.ok) {
          const list = await manRes.json();
          if (Array.isArray(list) && list.length) {
            for (const name of list) {
              const path = name.startsWith('data/') ? name : 'data/' + name;
              try {
                const res = await fetch(path);
                if (!res.ok) { console.warn('Archive not found:', path); continue; }
                ingest(await res.text(), path);
              } catch (e) {
                console.warn('Failed to load', path, e);
              }
            }
          }
        }
      } catch (e) {
        console.warn('No manifest or failed to load it:', e.message);
      }

      if (allTournaments.length === 0) {
        const fallback = (config.archives && config.archives.fallback) || 'data.csn';
        try {
          const res = await fetch(fallback);
          if (res.ok) ingest(await res.text(), fallback);
        } catch (e) {
          console.warn('Fallback data.csn also failed:', e.message);
        }
      }

      const parseEnd = performance.now();
      const ids = new Set();
      const unique = allTournaments.filter(t => {
        if (!t.meta || !t.meta.id) return false;
        if (ids.has(t.meta.id)) return false;
        ids.add(t.meta.id);
        return true;
      });

      return {
        tournaments: unique,
        sources,
        rawById,
        metrics: {
          characters: totalChars,
          bytes: totalBytes,
          lines: totalLines,
          parseTimeMs: +(parseEnd - parseStart).toFixed(1),
          loadSources: sources.length
        }
      };
    }

    function getAwardLabel(code) {
      const labels = (STATE.config && STATE.config.awardLabels) || {};
      return labels[code] || code;
    }

    async function boot() {
      try {
        const cfgRes = await fetch('config.json');
        if (!cfgRes.ok) throw new Error('config.json not found');
        const cfgText = await cfgRes.text();
        STATE.config = JSON.parse(cfgText);

        let miscText = '';
        try {
          const miscRes = await fetch('misc.json');
          if (miscRes.ok) {
            miscText = await miscRes.text();
            STATE.misc = Object.assign({ news: [], seasonalAwards: [], records: [], seasonNotes: {} }, JSON.parse(miscText));
          }
        } catch (e) {
          console.warn('misc.json not loaded:', e.message);
        }

        const { tournaments, sources, rawById, metrics: archMetrics } = await loadAllArchives(STATE.config);
        if (!tournaments.length) {
          throw new Error('No tournaments found. Add .csn files to data/ and list them in data/manifest.json');
        }
        STATE.tournaments = tournaments;
        STATE.rawById = rawById || {};
        STATE.archiveSources = sources;

        STATE.metrics.characters = (archMetrics.characters || 0) + cfgText.length + miscText.length;
        STATE.metrics.bytes = (archMetrics.bytes || 0) + new Blob([cfgText]).size + new Blob([miscText]).size;
        STATE.metrics.lines = (archMetrics.lines || 0) + cfgText.split('\n').length + miscText.split('\n').length;
        STATE.metrics.parseTimeMs = archMetrics.parseTimeMs || 0;
        STATE.metrics.loadSources = archMetrics.loadSources || 0;
        if (STATE.config.databaseVersion) STATE.metrics.databaseVersion = STATE.config.databaseVersion;
        if (STATE.config.csnVersion) STATE.metrics.csnVersion = STATE.config.csnVersion;

        const aggStart = performance.now();
        const agg = buildAggregates(STATE.tournaments);
        STATE.players = agg.players;
        STATE.teams = agg.teams;
        STATE.matches = agg.matches || [];
        STATE.metrics.parseTimeMs = +(STATE.metrics.parseTimeMs + (performance.now() - aggStart)).toFixed(1);
        STATE.ready = true;

        if (STATE.config.theme) {
          const t = STATE.config.theme;
          const root = document.documentElement;
          if (t.background) root.style.setProperty('--bg', t.background);
          if (t.panel) root.style.setProperty('--panel', t.panel);
          if (t.border) root.style.setProperty('--border', t.border);
          if (t.text) root.style.setProperty('--text', t.text);
          if (t.accent) root.style.setProperty('--accent', t.accent);
          if (t.muted) root.style.setProperty('--muted', t.muted);
        }
        if (STATE.config.siteTitle) document.title = STATE.config.siteTitle + ' — Archive';
        if (STATE.config.tagline) {
          const el = document.getElementById('site-tagline');
          if (el) el.textContent = STATE.config.tagline;
        }

        window.addEventListener('hashchange', route);
        route();
      } catch (err) {
        document.getElementById('app').innerHTML =
          `<div class="error"><strong>Failed to load archive</strong><br>${escapeHtml(err.message)}<br>
      Place .csn files in the <code>data/</code> folder and list them in <code>data/manifest.json</code>.</div>`;
      }
    }

    boot();
  </script>
</body>

</html>
