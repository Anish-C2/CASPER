<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASPER — Competitive Athletics & Sports Promotion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* Wikipedia-inspired encyclopedic theme */
    :root {
      --bg: #ffffff;
      --panel: #f8f9fa;
      --border: #a2a9b1;
      --border-light: #c8ccd1;
      --text: #202122;
      --accent: #3366cc;
      --muted: #54595d;
      --link: #0645ad;
      --link-visited: #0b0080;
      --table-header: #eaecf0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Linux Libertine", "Georgia", "Times New Roman", Times, serif;
      background: #fff;
      color: #202122;
      line-height: 1.6;
      font-size: 14px;
      min-height: 100vh;
    }

    a {
      color: #0645ad;
      text-decoration: none;
    }

    a:visited {
      color: #0b0080;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #c8ccd1;
    }

    .header-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 6px 12px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      color: #000;
      font-weight: normal;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border: 1px solid #a2a9b1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #202122;
      font-family: sans-serif;
      background: #f8f9fa;
    }

    .logo span.tag {
      color: #54595d;
      font-size: 11px;
      font-weight: normal;
      border-left: 1px solid #c8ccd1;
      padding-left: 8px;
      font-family: sans-serif;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border-top: 1px solid #c8ccd1;
      background: #f8f9fa;
      padding: 0 6px;
      font-family: sans-serif;
      font-size: 12px;
      max-width: 100%;
      line-height: 1.2;
    }

    nav a {
      color: #202122;
      padding: 5px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    nav a i {
      font-size: 0.9em;
      opacity: 0.85;
    }

    nav a:hover {
      background: #eaecf0;
      text-decoration: none;
      color: #202122;
    }

    nav a.active {
      background: #fff;
      border: 1px solid #c8ccd1;
      border-bottom-color: #fff;
      margin-bottom: -1px;
      font-weight: bold;
      color: #202122;
    }

    @media (max-width: 900px) {
      nav a {
        padding: 4px 6px;
        font-size: 11px;
      }

      .logo span.tag {
        display: none;
      }
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px 48px;
    }

    h1 {
      font-family: "Linux Libertine", Georgia, "Times New Roman", serif;
      font-size: 1.8em;
      font-weight: normal;
      border-bottom: 1px solid #a2a9b1;
      padding-bottom: 3px;
      margin: 0 0 12px;
      color: #000;
    }

    h2,
    .section-title {
      font-family: "Linux Libertine", Georgia, "Times New Roman", serif;
      font-size: 1.3em;
      font-weight: normal;
      border-bottom: 1px solid #a2a9b1;
      padding-bottom: 2px;
      margin: 18px 0 8px;
      color: #000;
      letter-spacing: 0;
      text-transform: none;
    }

    h3 {
      font-family: "Linux Libertine", Georgia, serif;
      font-size: 1.15em;
      font-weight: bold;
      margin: 12px 0 6px;
      color: #000;
    }

    .panel {
      background: #fff;
      border: 1px solid #c8ccd1;
      border-radius: 2px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .split-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .split-4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 900px) {

      .grid2,
      .grid3,
      .grid4,
      .split-3,
      .split-4 {
        grid-template-columns: 1fr;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 6px 0 10px;
      font-family: sans-serif;
    }

    th,
    td {
      border: 1px solid #a2a9b1;
      padding: 4px 8px;
      text-align: left;
    }

    th {
      background: #eaecf0;
      color: #202122;
      font-weight: bold;
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
    }

    tr:nth-child(even) td {
      background: #f8f9fa;
    }

    tr:hover td {
      background: #eaecf0;
    }

    .muted {
      color: #54595d;
    }

    .accent {
      color: #000;
      font-weight: bold;
    }

    .stat-box,
    .mini-stat,
    .mega-strip .cell {
      background: #f8f9fa;
      border: 1px solid #c8ccd1;
      border-radius: 2px;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-box .num,
    .mini-stat .n,
    .mega-strip .cell .n {
      font-size: 18px;
      font-weight: bold;
      color: #000;
      display: block;
      line-height: 1.2;
      font-family: sans-serif;
    }

    .stat-box .lbl,
    .mini-stat .l,
    .mega-strip .cell .l {
      font-size: 11px;
      color: #54595d;
      display: block;
      font-family: sans-serif;
      text-transform: none;
      letter-spacing: 0;
    }

    .dense-grid,
    .mega-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }

    .badge,
    .status,
    .stage-tag,
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border: 1px solid #a2a9b1;
      border-radius: 2px;
      background: #f8f9fa;
      color: #202122;
      margin-right: 3px;
      font-family: sans-serif;
    }

    .status.completed {
      border-color: #14866d;
      color: #14866d;
      background: #eef9f5;
    }

    .status.ongoing {
      border-color: #3366cc;
      color: #3366cc;
      background: #f0f5ff;
    }

    .status.scheduled,
    .status.tobeplayed {
      border-color: #a2a9b1;
      color: #54595d;
    }

    .status.cancelled {
      border-color: #b32424;
      color: #b32424;
      background: #fef0f0;
    }

    .stage-tag {
      border-color: #3366cc;
      color: #3366cc;
      background: #f0f5ff;
      font-weight: bold;
    }

    .match-score {
      font-weight: bold;
      color: #000;
      font-family: sans-serif;
    }

    .cards {
      font-size: 12px;
      color: #54595d;
      font-family: sans-serif;
    }

    .search-box {
      width: 100%;
      max-width: 420px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid #a2a9b1;
      border-radius: 2px;
      color: #202122;
      font-family: sans-serif;
      font-size: 14px;
    }

    .search-box:focus {
      outline: 1px solid #3366cc;
      border-color: #3366cc;
    }

    .timeline-item {
      border-left: 2px solid #c8ccd1;
      padding: 4px 0 4px 12px;
      margin-left: 4px;
      position: relative;
    }

    .timeline-item::before {
      content: "";
      width: 7px;
      height: 7px;
      background: #202122;
      border-radius: 50%;
      position: absolute;
      left: -4.5px;
      top: 10px;
    }

    .news-item {
      border-bottom: 1px solid #c8ccd1;
      padding: 8px 0;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-item .date {
      color: #54595d;
      font-size: 12px;
      font-family: sans-serif;
    }

    .news-item .title {
      color: #000;
      font-size: 15px;
      font-weight: bold;
      margin: 2px 0;
    }

    .award-line {
      padding: 4px 0;
      border-bottom: 1px solid #c8ccd1;
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .award-line .count {
      color: #000;
      font-weight: bold;
    }

    .copy-btn,
    button.btn {
      background: #f8f9fa;
      border: 1px solid #a2a9b1;
      color: #202122;
      padding: 3px 9px;
      border-radius: 2px;
      font-family: sans-serif;
      font-size: 12px;
      cursor: pointer;
    }

    .copy-btn:hover,
    button.btn:hover {
      background: #eaecf0;
    }

    .bracket {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 0;
    }

    .bracket-round {
      min-width: 140px;
    }

    .bracket-round h4 {
      color: #54595d;
      margin-bottom: 6px;
      font-size: 12px;
      font-family: sans-serif;
      text-transform: uppercase;
      border: none;
      font-weight: bold;
      padding: 0;
    }

    .bracket-match {
      border: 1px solid #c8ccd1;
      background: #f8f9fa;
      border-radius: 2px;
      padding: 6px 8px;
      margin-bottom: 6px;
      font-size: 12px;
      font-family: sans-serif;
    }

    .bracket-match .score {
      color: #000;
      font-weight: bold;
    }

    pre.csn-raw {
      background: #f8f9fa;
      border: 1px solid #c8ccd1;
      border-radius: 2px;
      padding: 10px;
      font-size: 12px;
      overflow: auto;
      max-height: 280px;
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
    }

    .back {
      font-size: 13px;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #0645ad;
      font-family: sans-serif;
    }

    .empty {
      color: #54595d;
      font-style: italic;
      padding: 8px;
    }

    .error {
      color: #b32424;
      padding: 10px;
      border: 1px solid #b32424;
      background: #fef0f0;
      border-radius: 2px;
      font-family: sans-serif;
    }

    .loading {
      color: #54595d;
      padding: 40px;
      text-align: center;
    }

    footer {
      border-top: 1px solid #c8ccd1;
      padding: 12px 16px;
      text-align: center;
      color: #54595d;
      font-size: 12px;
      margin-top: 20px;
      font-family: sans-serif;
      background: #f8f9fa;
    }

    ul.plain {
      list-style: none;
    }

    ul.plain li {
      padding: 3px 0;
      border-bottom: 1px solid #c8ccd1;
    }

    .career-top {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #f8f9fa;
      border: 1px solid #a2a9b1;
      border-radius: 2px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 2px;
      background: #eaecf0;
      border: 1px solid #a2a9b1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #54595d;
      flex-shrink: 0;
      font-family: sans-serif;
    }

    .career-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 8px 0;
      font-size: 12px;
      color: #54595d;
      font-family: sans-serif;
    }

    .career-meta strong {
      color: #000;
      display: block;
      font-size: 13px;
    }

    .big-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .big-stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .career-top {
        flex-direction: column;
      }
    }

    .big-stats .cell {
      background: #fff;
      border: 1px solid #c8ccd1;
      border-radius: 2px;
      padding: 8px;
      text-align: center;
    }

    .big-stats .cell .n {
      font-size: 20px;
      font-weight: bold;
      color: #000;
      font-family: sans-serif;
    }

    .big-stats .cell .l {
      font-size: 11px;
      color: #54595d;
      font-family: sans-serif;
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: #f8f9fa;
      border: 1px solid #c8ccd1;
      border-radius: 2px;
      padding: 8px;
      margin-bottom: 12px;
    }

    @media (max-width: 800px) {
      .quick-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .quick-row .q {
      text-align: center;
      padding: 4px;
    }

    .quick-row .q .n {
      font-size: 15px;
      font-weight: bold;
      color: #000;
      font-family: sans-serif;
    }

    .quick-row .q .l {
      font-size: 10px;
      color: #54595d;
      font-family: sans-serif;
      text-transform: uppercase;
    }

    .trophy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
    }

    .trophy {
      background: #fff;
      border: 1px solid #c8ccd1;
      border-radius: 2px;
      padding: 10px 6px;
      text-align: center;
    }

    .trophy .n {
      font-size: 18px;
      font-weight: bold;
      color: #000;
      font-family: sans-serif;
    }

    .trophy .l {
      font-size: 11px;
      color: #54595d;
      font-family: sans-serif;
    }

    .club-line {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #c8ccd1;
    }

    .club-line:last-child {
      border-bottom: none;
    }

    .club-dot {
      width: 32px;
      height: 32px;
      border-radius: 2px;
      background: #eaecf0;
      border: 1px solid #a2a9b1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #202122;
      flex-shrink: 0;
      font-family: sans-serif;
    }

    .i {
      margin-right: 5px;
      opacity: 0.7;
      font-size: 0.85em;
      color: #54595d;
    }

    .inline-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 13px;
      margin: 4px 0 8px;
      font-family: sans-serif;
    }

    .inline-stats b {
      color: #000;
    }

    .kv-table td:first-child {
      color: #54595d;
      width: 42%;
    }

    .pyramid-wrap {
      background: #f8f9fa;
      border: 1px solid #a2a9b1;
      padding: 14px 10px;
      margin: 12px 0;
      overflow-x: auto;
    }

    .pyramid-wrap pre {
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.35;
      color: #202122;
      margin: 0;
      white-space: pre;
      text-align: left;
    }

    .pyramid-title {
      text-align: center;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .pyramid-legend {
      font-family: sans-serif;
      font-size: 12px;
      color: #54595d;
      margin-top: 10px;
      border-top: 1px solid #c8ccd1;
      padding-top: 8px;
    }

    .pyramid-legend table {
      font-size: 12px;
    }


    /* CASPER Football Pyramid diagram */
    .pyramid {
      font-family: sans-serif;
      font-size: 13px;
      margin: 12px 0 16px;
    }

    .pyramid-title {
      text-align: center;
      font-family: "Linux Libertine", Georgia, serif;
      font-size: 1.4em;
      font-weight: normal;
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    .pyr-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .pyr-node {
      border: 1px solid #a2a9b1;
      background: #f8f9fa;
      padding: 10px 16px;
      text-align: center;
      min-width: 220px;
      max-width: 520px;
      width: 100%;
    }

    .pyr-node.primary {
      background: #fff;
      border-width: 2px;
      border-color: #202122;
    }

    .pyr-node .name {
      font-weight: bold;
      font-size: 14px;
      color: #000;
    }

    .pyr-node .detail {
      color: #54595d;
      font-size: 12px;
      margin-top: 2px;
    }

    .pyr-arrow {
      color: #54595d;
      font-size: 18px;
      line-height: 1.2;
      padding: 2px 0;
    }

    .pyr-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .pyr-branch {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pyr-label {
      font-size: 11px;
      color: #54595d;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .pyr-section {
      border: 1px solid #c8ccd1;
      background: #fff;
      padding: 12px 14px;
      margin-top: 16px;
    }

    .pyr-section h3 {
      margin: 0 0 10px;
      font-size: 1.05em;
      border-bottom: 1px solid #c8ccd1;
      padding-bottom: 4px;
    }

    .pyr-path {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      margin: 6px 0;
      font-size: 13px;
    }

    .pyr-chip {
      border: 1px solid #a2a9b1;
      background: #f8f9fa;
      padding: 3px 8px;
      font-size: 12px;
    }

    .pyr-chip.final {
      border-color: #202122;
      border-width: 2px;
      background: #fff;
      font-weight: bold;
    }

    .pyr-trophies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .pyr-trophy {
      border: 1px solid #c8ccd1;
      padding: 8px 10px;
      background: #f8f9fa;
    }

    .pyr-trophy .t-name {
      font-weight: bold;
    }

    .pyr-trophy .t-note {
      color: #54595d;
      font-size: 12px;
      margin-top: 2px;
    }

    .pyr-trophy.crown {
      border-left: 3px solid #202122;
    }

    .pyr-trophy.gold {
      border-left: 3px solid #a2a9b1;
    }

    .pyr-trophy.silver {
      border-left: 3px solid #c8ccd1;
    }

    .pyr-trophy.bronze {
      border-left: 3px solid #eaecf0;
    }

    @media (max-width: 640px) {
      .pyr-split {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<body>
  <header>
    <div class="header-bar">
      <div class="logo">
        <div class="logo-mark">CA</div>
        CASPER
        <span class="tag" id="site-tagline">Competitive Athletics &amp; Sports Promotion</span>
      </div>
    </div>
    <nav id="main-nav">
      <a href="#home" data-view="home"><i class="fa-solid fa-house"></i> Home</a>
      <a href="#archive" data-view="archive"><i class="fa-solid fa-box-archive"></i> Archive</a>
      <a href="#competitions" data-view="competitions"><i class="fa-solid fa-trophy"></i> Competitions</a>
      <a href="#news" data-view="news"><i class="fa-solid fa-newspaper"></i> News</a>
      <a href="#players" data-view="players"><i class="fa-solid fa-users"></i> Players</a>
      <a href="#teams" data-view="teams"><i class="fa-solid fa-shield-halved"></i> Teams</a>
      <a href="#awards" data-view="awards"><i class="fa-solid fa-trophy"></i> Awards</a>
      <a href="#records" data-view="records"><i class="fa-solid fa-medal"></i> Records</a>
      <a href="#statistics" data-view="statistics"><i class="fa-solid fa-chart-column"></i> Statistics</a>
      <a href="#database" data-view="database"><i class="fa-solid fa-database"></i> Database</a>
      <a href="#search" data-view="search"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
      <a href="#structure" data-view="structure"><i class="fa-solid fa-diagram-project"></i> Structure</a>
      <a href="#about" data-view="about"><i class="fa-solid fa-circle-info"></i> About</a>
    </nav>
  </header>

  <script>
    /* ============================================================
       CASPER Index — pure vanilla JS, no shared code with fill.html
       ============================================================ */

    const STATE = {
      config: null,
      tournaments: [],
      players: {},
      teams: {},
      matches: [],
      misc: { news: [], seasonalAwards: [], records: [], seasonNotes: {} },
      rawById: {},
      ready: false,
      metrics: {
        databaseVersion: '2026.08',
        csnVersion: '1.2',
        characters: 0,
        bytes: 0,
        lines: 0,
        parseTimeMs: 0,
        renderTimeMs: 0,
        loadSources: 0
      }
    };

    /* ---------- CSN PARSER ---------- */
    function parseCSN(text) {
      if (!text || typeof text !== 'string') return [];
      // Strip full-line comments only (so match stage tags like #F are preserved)
      let cleaned = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      cleaned = cleaned.split('\n').map(line => {
        if (line.trim().startsWith('#')) return '';
        return line;
      }).join('\n');

      const tournaments = [];
      let i = 0;
      const len = cleaned.length;

      function skipWS() {
        while (i < len && /\s/.test(cleaned[i])) i++;
      }
      function peek() { return cleaned[i]; }
      function next() { return cleaned[i++]; }

      function readUntil(chars) {
        let s = '';
        while (i < len && chars.indexOf(cleaned[i]) === -1) {
          s += cleaned[i++];
        }
        return s.trim();
      }

      function parseValue() {
        skipWS();
        if (peek() === '(') {
          next(); // (
          const body = [];
          let depth = 1;
          let start = i;
          while (i < len && depth > 0) {
            if (cleaned[i] === '(') depth++;
            else if (cleaned[i] === ')') depth--;
            if (depth > 0) i++;
          }
          const inner = cleaned.slice(start, i).trim();
          if (peek() === ')') next();
          return { type: 'func', body: inner };
        }
        // plain value until ; or end of block
        let val = '';
        while (i < len && cleaned[i] !== ';' && cleaned[i] !== ']') {
          val += cleaned[i++];
        }
        return { type: 'val', body: val.trim() };
      }

      function parseTournament() {
        const t = {
          meta: {},
          n: {},          // abbr -> {name, player}
          grp: {},        // group -> [abbr]
          m: [],          // matches
          st: {},         // group -> [{team, pts, gd}]
          aw: {},         // award -> value
          ac: [],         // achievements
          nt: ''
        };
        skipWS();
        if (peek() !== '[') return null;
        next(); // [

        while (i < len) {
          skipWS();
          if (peek() === ']') { next(); break; }
          if (peek() === ';' || peek() === ',') { next(); continue; }

          // key (letters/digits/underscore)
          let key = '';
          while (i < len && /[a-zA-Z0-9_]/.test(cleaned[i])) {
            key += cleaned[i++];
          }
          if (!key) { next(); continue; }
          skipWS();

          // CSN allows both key=value;  and  key(...);  (no equals for functions)
          let val;
          if (peek() === '=') {
            next(); // consume =
            skipWS();
            val = parseValue();
          } else if (peek() === '(') {
            // bare function form: n( ... )  /  m( ... )  etc.
            val = parseValue();
          } else {
            // unknown token – skip
            continue;
          }
          if (peek() === ';') next();

          if (val.type === 'val') {
            t.meta[key] = val.body;
          } else {
            // function body
            const body = val.body;
            if (key === 'n') {
              // abbr=TeamName[Player], ...
              const parts = body.split(',');
              parts.forEach(p => {
                p = p.trim();
                if (!p) return;
                const m = p.match(/^([^=]+)=([^\[]+)\[([^\]]*)\]/);
                if (m) {
                  t.n[m[1].trim()] = { name: m[2].trim(), player: m[3].trim() };
                }
              });
            } else if (key === 'grp') {
              // A>bbu,kok; B>...
              const groups = body.split(';');
              groups.forEach(g => {
                g = g.trim();
                if (!g) return;
                const m = g.match(/^([A-Za-z0-9]+)>(.*)/);
                if (m) {
                  t.grp[m[1].trim()] = m[2].split(',').map(s => s.trim()).filter(Boolean);
                }
              });
            } else if (key === 'm') {
              // matches separated by ;
              const matches = body.split(';');
              matches.forEach(raw => {
                raw = raw.trim();
                if (!raw) return;
                const match = parseMatch(raw);
                if (match) t.m.push(match);
              });
            } else if (key === 'st') {
              // A:\nteam,pts,+gd; ...
              const blocks = body.split(/(?=[A-Za-z0-9]+:)/);
              blocks.forEach(b => {
                b = b.trim();
                if (!b) return;
                const m = b.match(/^([A-Za-z0-9]+):\s*([\s\S]*)/);
                if (m) {
                  const g = m[1];
                  t.st[g] = [];
                  m[2].split(';').forEach(line => {
                    line = line.trim();
                    if (!line) return;
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                      t.st[g].push({
                        team: parts[0].trim(),
                        pts: parseInt(parts[1], 10) || 0,
                        gd: parts[2] ? parts[2].trim() : '0'
                      });
                    }
                  });
                }
              });
            } else if (key === 'aw') {
              body.split(';').forEach(pair => {
                pair = pair.trim();
                if (!pair) return;
                const eq = pair.indexOf('=');
                if (eq > 0) {
                  t.aw[pair.slice(0, eq).trim()] = pair.slice(eq + 1).trim();
                }
              });
            } else if (key === 'ac') {
              t.ac = body.split(';').map(s => s.trim()).filter(Boolean);
            } else if (key === 'nt') {
              t.nt = body.trim();
            } else {
              // unknown function – store raw
              t.meta[key] = body;
            }
          }
        }
        return t;
      }

      function parseMatch(raw) {
        // bbu-kok:3-2(et,p2-0,y1-0,r0-1,F)  or  bbu-kok:3-2#F  or  bbu-kok:3-2(p2-0)#SF
        const STAGE_CODES = {
          F: 'Final', SF: 'Semi-final', QF: 'Quarter-final',
          R16: 'Round of 16', R32: 'Round of 32', R64: 'Round of 64',
          '3P': 'Third Place', TP: 'Third Place', GS: 'Group Stage',
          FINAL: 'Final', SEMI: 'Semi-final', QUARTER: 'Quarter-final'
        };
        let stageFromHash = null;
        let work = raw;
        const hashM = work.match(/#([A-Za-z0-9]+)\s*$/);
        if (hashM) {
          stageFromHash = hashM[1].toUpperCase();
          work = work.slice(0, hashM.index).trim();
        }
        const m = work.match(/^([a-zA-Z0-9]+)-([a-zA-Z0-9]+):(\d+)-(\d+)(?:\(([^)]*)\))?/);
        if (!m) return null;
        const match = {
          home: m[1],
          away: m[2],
          sh: parseInt(m[3], 10),
          sa: parseInt(m[4], 10),
          et: false,
          p: null,
          y: null,
          r: null,
          stage: null,
          stageLabel: null,
          raw: raw
        };
        if (m[5]) {
          const extras = m[5].split(',');
          extras.forEach(e => {
            e = e.trim();
            if (e === 'et') match.et = true;
            else if (e.startsWith('p') && /p\d+-\d+/.test(e)) {
              const pm = e.match(/p(\d+)-(\d+)/);
              if (pm) match.p = [parseInt(pm[1], 10), parseInt(pm[2], 10)];
            } else if (e.startsWith('y') && /y\d+-\d+/.test(e)) {
              const ym = e.match(/y(\d+)-(\d+)/);
              if (ym) match.y = [parseInt(ym[1], 10), parseInt(ym[2], 10)];
            } else if (e.startsWith('r') && /r\d+-\d+/.test(e)) {
              const rm = e.match(/r(\d+)-(\d+)/);
              if (rm) match.r = [parseInt(rm[1], 10), parseInt(rm[2], 10)];
            } else {
              // possible stage code inside paren
              const code = e.toUpperCase();
              if (STAGE_CODES[code]) {
                match.stage = code;
                match.stageLabel = STAGE_CODES[code];
              }
            }
          });
        }
        if (!match.stage && stageFromHash) {
          match.stage = stageFromHash;
          match.stageLabel = STAGE_CODES[stageFromHash] || stageFromHash;
        }
        return match;
      }

      while (i < len) {
        skipWS();
        if (i >= len) break;
        if (peek() === '[') {
          const t = parseTournament();
          if (t && t.meta.id) tournaments.push(t);
        } else {
          i++;
        }
      }
      return tournaments;
    }

    /* ---------- AGGREGATION ---------- */
    function buildAggregates(tournaments) {
      const players = {};
      const teams = {};
      const matches = []; // flat index of all matches with context

      function ensurePlayer(name) {
        const key = name.toLowerCase();
        if (!players[key]) {
          players[key] = {
            name,
            teams: new Set(),
            goals: 0, conceded: 0,
            matches: 0,
            wins: 0, draws: 0, losses: 0,
            yellow: 0, red: 0,
            titles: 0, runnerUps: 0,
            awards: [],
            tournaments: [],
            cleanSheets: 0,
            failedToScore: 0,
            penaltiesWon: 0, penaltiesLost: 0,
            biggestWin: 0,
            highestScoring: 0,
            etMatches: 0, etWins: 0,
            groupMatches: 0, groupWins: 0,
            knockoutMatches: 0, knockoutWins: 0,
            goalsByStage: {},
            matchIds: [],
            elo: 1500,
            peakElo: 1500
          };
        }
        return players[key];
      }
      function ensureTeam(abbr, info) {
        if (!teams[abbr]) {
          teams[abbr] = {
            abbr,
            name: info ? info.name : abbr,
            player: info ? info.player : '',
            goalsFor: 0, goalsAgainst: 0,
            matches: 0,
            wins: 0, draws: 0, losses: 0,
            yellow: 0, red: 0,
            titles: 0, runnerUps: 0,
            tournaments: [],
            cleanSheets: 0,
            failedToScore: 0,
            penaltiesWon: 0, penaltiesLost: 0,
            biggestWin: 0,
            highestScoring: 0,
            etMatches: 0, etWins: 0,
            groupMatches: 0, groupWins: 0,
            knockoutMatches: 0, knockoutWins: 0,
            matchIds: [],
            elo: 1500,
            peakElo: 1500
          };
        }
        return teams[abbr];
      }

      function isKnockout(stage) {
        if (!stage || stage === 'GS') return false;
        return true;
      }

      tournaments.forEach(t => {
        Object.keys(t.n).forEach(abbr => {
          const info = t.n[abbr];
          const team = ensureTeam(abbr, info);
          team.name = info.name;
          team.player = info.player;
          if (info.player) ensurePlayer(info.player).teams.add(abbr);
        });

        t.m.forEach((m, mi) => {
          const matchId = t.meta.id + '/' + mi;
          const th = ensureTeam(m.home);
          const ta = ensureTeam(m.away);
          th.matches++; ta.matches++;
          th.goalsFor += m.sh; th.goalsAgainst += m.sa;
          ta.goalsFor += m.sa; ta.goalsAgainst += m.sh;
          th.matchIds.push(matchId); ta.matchIds.push(matchId);

          let homeWin = false, awayWin = false, draw = false;
          if (m.p) {
            homeWin = m.p[0] > m.p[1];
            awayWin = m.p[1] > m.p[0];
          } else if (m.sh > m.sa) homeWin = true;
          else if (m.sa > m.sh) awayWin = true;
          else draw = true;

          if (homeWin) { th.wins++; ta.losses++; }
          else if (awayWin) { ta.wins++; th.losses++; }
          else { th.draws++; ta.draws++; }

          if (m.y) { th.yellow += m.y[0]; ta.yellow += m.y[1]; }
          if (m.r) { th.red += m.r[0]; ta.red += m.r[1]; }

          // clean sheets / failed to score
          if (m.sa === 0) th.cleanSheets++;
          if (m.sh === 0) ta.cleanSheets++;
          if (m.sh === 0) th.failedToScore++;
          if (m.sa === 0) ta.failedToScore++;

          // margins
          const margin = Math.abs(m.sh - m.sa);
          const totalG = m.sh + m.sa;
          if (homeWin && margin > th.biggestWin) th.biggestWin = margin;
          if (awayWin && margin > ta.biggestWin) ta.biggestWin = margin;
          if (totalG > th.highestScoring) th.highestScoring = totalG;
          if (totalG > ta.highestScoring) ta.highestScoring = totalG;

          // ET / pens
          if (m.et) {
            th.etMatches++; ta.etMatches++;
            if (homeWin) th.etWins++;
            if (awayWin) ta.etWins++;
          }
          if (m.p) {
            if (m.p[0] > m.p[1]) { th.penaltiesWon++; ta.penaltiesLost++; }
            else { ta.penaltiesWon++; th.penaltiesLost++; }
          }

          // stage buckets
          const ko = isKnockout(m.stage);
          if (ko) {
            th.knockoutMatches++; ta.knockoutMatches++;
            if (homeWin) th.knockoutWins++;
            if (awayWin) ta.knockoutWins++;
          } else {
            th.groupMatches++; ta.groupMatches++;
            if (homeWin) th.groupWins++;
            if (awayWin) ta.groupWins++;
          }

          const ph = t.n[m.home] && t.n[m.home].player;
          const pa = t.n[m.away] && t.n[m.away].player;

          function applyPlayer(name, scored, conceded, won, lost, drew, y, r) {
            if (!name) return;
            const p = ensurePlayer(name);
            p.goals += scored;
            p.conceded += conceded;
            p.matches++;
            if (won) p.wins++;
            else if (lost) p.losses++;
            else p.draws++;
            if (y) p.yellow += y;
            if (r) p.red += r;
            if (conceded === 0) p.cleanSheets++;
            if (scored === 0) p.failedToScore++;
            if (won && Math.abs(scored - conceded) > p.biggestWin) p.biggestWin = Math.abs(scored - conceded);
            if (scored + conceded > p.highestScoring) p.highestScoring = scored + conceded;
            if (m.et) {
              p.etMatches++;
              if (won) p.etWins++;
            }
            if (m.p) {
              if (won) p.penaltiesWon++;
              else if (lost) p.penaltiesLost++;
            }
            if (ko) {
              p.knockoutMatches++;
              if (won) p.knockoutWins++;
            } else {
              p.groupMatches++;
              if (won) p.groupWins++;
            }
            const st = m.stage || 'GS';
            if (!p.goalsByStage[st]) p.goalsByStage[st] = 0;
            p.goalsByStage[st] += scored;
            p.matchIds.push(matchId);
          }

          applyPlayer(ph, m.sh, m.sa, homeWin, awayWin, draw, m.y ? m.y[0] : 0, m.r ? m.r[0] : 0);
          applyPlayer(pa, m.sa, m.sh, awayWin, homeWin, draw, m.y ? m.y[1] : 0, m.r ? m.r[1] : 0);

          matches.push({
            id: matchId,
            tourneyId: t.meta.id,
            index: mi,
            home: m.home, away: m.away,
            sh: m.sh, sa: m.sa,
            et: m.et, p: m.p, y: m.y, r: m.r,
            stage: m.stage, stageLabel: m.stageLabel,
            event: t.meta.e, season: t.meta.s,
            homeWin, awayWin, draw,
            homePlayer: ph || '', awayPlayer: pa || '',
            homeName: t.n[m.home] ? t.n[m.home].name : m.home,
            awayName: t.n[m.away] ? t.n[m.away].name : m.away
          });
        });

        if (t.aw.ch) {
          const abbr = t.aw.ch;
          ensureTeam(abbr).titles++;
          const info = t.n[abbr];
          if (info && info.player) {
            ensurePlayer(info.player).titles++;
            ensurePlayer(info.player).awards.push({ tourney: t.meta.id, award: 'Champion' });
          }
        }
        if (t.aw.ru) {
          const abbr = t.aw.ru;
          ensureTeam(abbr).runnerUps++;
          const info = t.n[abbr];
          if (info && info.player) {
            ensurePlayer(info.player).runnerUps++;
            ensurePlayer(info.player).awards.push({ tourney: t.meta.id, award: 'Runner-up' });
          }
        }
        Object.keys(t.aw).forEach(k => {
          if (k === 'ch' || k === 'ru') return;
          const val = t.aw[k];
          let p = players[val.toLowerCase()];
          if (!p && t.n[val] && t.n[val].player) p = ensurePlayer(t.n[val].player);
          if (p) p.awards.push({ tourney: t.meta.id, award: getAwardLabel(k) });
        });

        Object.keys(t.n).forEach(abbr => {
          ensureTeam(abbr).tournaments.push(t.meta.id);
          const info = t.n[abbr];
          if (info && info.player) ensurePlayer(info.player).tournaments.push(t.meta.id);
        });
      });

      Object.values(players).forEach(p => { p.teams = Array.from(p.teams); });

      // ELO — chronological, player-centric (base 1500, K=32)
      const chrono = tournaments.slice().sort((a, b) => {
        const da = (a.meta.dos || a.meta.doc || '00000000');
        const db = (b.meta.dos || b.meta.doc || '00000000');
        const sa = da.slice(4) + da.slice(2, 4) + da.slice(0, 2);
        const sb = db.slice(4) + db.slice(2, 4) + db.slice(0, 2);
        return sa.localeCompare(sb);
      });
      const K = 32;
      function expectedScore(ra, rb) {
        return 1 / (1 + Math.pow(10, (rb - ra) / 400));
      }
      chrono.forEach(t => {
        t.m.forEach(m => {
          const ph = t.n[m.home] && t.n[m.home].player;
          const pa = t.n[m.away] && t.n[m.away].player;
          if (!ph || !pa) return;
          const pHome = ensurePlayer(ph);
          const pAway = ensurePlayer(pa);
          const th = ensureTeam(m.home);
          const ta = ensureTeam(m.away);
          let scoreH = 0.5, scoreA = 0.5;
          if (m.p) {
            if (m.p[0] > m.p[1]) { scoreH = 1; scoreA = 0; }
            else if (m.p[1] > m.p[0]) { scoreH = 0; scoreA = 1; }
          } else if (m.sh > m.sa) { scoreH = 1; scoreA = 0; }
          else if (m.sa > m.sh) { scoreH = 0; scoreA = 1; }
          const expH = expectedScore(pHome.elo, pAway.elo);
          const newH = Math.round(pHome.elo + K * (scoreH - expH));
          const newA = Math.round(pAway.elo + K * (scoreA - (1 - expH)));
          pHome.elo = newH; pAway.elo = newA;
          if (newH > pHome.peakElo) pHome.peakElo = newH;
          if (newA > pAway.peakElo) pAway.peakElo = newA;
          th.elo = newH; ta.elo = newA;
          if (newH > th.peakElo) th.peakElo = newH;
          if (newA > ta.peakElo) ta.peakElo = newA;
        });
      });

      return { players, teams, matches };
    }

    /* ---------- UTILITIES ---------- */
    function fmtDate(ddmmyyyy) {
      if (!ddmmyyyy || ddmmyyyy.length !== 8) return ddmmyyyy || '—';
      return ddmmyyyy.slice(0, 2) + '/' + ddmmyyyy.slice(2, 4) + '/' + ddmmyyyy.slice(4);
    }
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function sortByDate(tours, newestFirst) {
      return tours.slice().sort((a, b) => {
        const da = a.meta.doc || a.meta.dos || '00000000';
        const db = b.meta.doc || b.meta.dos || '00000000';
        // convert DDMMYYYY to sortable
        const sa = da.slice(4) + da.slice(2, 4) + da.slice(0, 2);
        const sb = db.slice(4) + db.slice(2, 4) + db.slice(0, 2);
        return newestFirst ? sb.localeCompare(sa) : sa.localeCompare(sb);
      });
    }
    function playerWinRate(p) {
      if (!p.matches) return '—';
      return ((p.wins / p.matches) * 100).toFixed(1) + '%';
    }
    function teamGD(t) {
      return t.goalsFor - t.goalsAgainst;
    }

    function getStatus(t) {
      const sts = (t.meta.sts || '').trim();
      if (sts) {
        const low = sts.toLowerCase();
        if (low.includes('complet')) return { key: 'completed', label: 'Completed' };
        if (low.includes('ongoing') || low.includes('live')) return { key: 'ongoing', label: 'Ongoing' };
        if (low.includes('cancel')) return { key: 'cancelled', label: 'Cancelled' };
        if (low.includes('schedul') || low.includes('to be') || low.includes('upcoming')) return { key: 'scheduled', label: 'To be played' };
        return { key: 'scheduled', label: sts };
      }
      // Infer from dates
      const today = '06082026'; // fallback; real sites can use new Date
      try {
        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = String(now.getFullYear());
        const todayStr = dd + mm + yyyy;
        const dos = t.meta.dos || '';
        const doc = t.meta.doc || '';
        const toSort = d => d && d.length === 8 ? d.slice(4) + d.slice(2, 4) + d.slice(0, 2) : '';
        const ts = toSort(todayStr), s = toSort(dos), e = toSort(doc);
        if (e && ts > e) return { key: 'completed', label: 'Completed' };
        if (s && e && ts >= s && ts <= e) return { key: 'ongoing', label: 'Ongoing' };
        if (s && ts < s) return { key: 'scheduled', label: 'To be played' };
        if (doc) return { key: 'completed', label: 'Completed' };
      } catch (e) { }
      return { key: 'completed', label: 'Completed' };
    }

    function statusBadge(t) {
      const st = getStatus(t);
      return `<span class="status ${st.key}">${escapeHtml(st.label)}</span>`;
    }

    function calcStandings(t) {
      // If explicit st() exists, use it
      if (t.st && Object.keys(t.st).length) return t.st;
      // Otherwise compute from group matches
      if (!t.grp || !Object.keys(t.grp).length) return {};
      const result = {};
      Object.keys(t.grp).forEach(g => {
        const teams = t.grp[g];
        const table = {};
        teams.forEach(abbr => {
          table[abbr] = { team: abbr, pts: 0, gf: 0, ga: 0, w: 0, d: 0, l: 0 };
        });
        t.m.forEach(m => {
          // Prefer GS-tagged matches; if no stage tags at all, use any intra-group match
          if (m.stage && m.stage !== 'GS') return;
          const inGroup = teams.includes(m.home) && teams.includes(m.away);
          if (!inGroup) return;
          if (!table[m.home] || !table[m.away]) return;
          table[m.home].gf += m.sh; table[m.home].ga += m.sa;
          table[m.away].gf += m.sa; table[m.away].ga += m.sh;
          let hw = false, aw = false, dr = false;
          if (m.p) { hw = m.p[0] > m.p[1]; aw = m.p[1] > m.p[0]; }
          else if (m.sh > m.sa) hw = true;
          else if (m.sa > m.sh) aw = true;
          else dr = true;
          if (hw) { table[m.home].pts += 3; table[m.home].w++; table[m.away].l++; }
          else if (aw) { table[m.away].pts += 3; table[m.away].w++; table[m.home].l++; }
          else { table[m.home].pts += 1; table[m.away].pts += 1; table[m.home].d++; table[m.away].d++; }
        });
        result[g] = Object.values(table)
          .map(r => ({
            team: r.team,
            pts: r.pts,
            gd: (r.gf - r.ga >= 0 ? '+' : '') + (r.gf - r.ga),
            gf: r.gf, ga: r.ga, w: r.w, d: r.d, l: r.l
          }))
          .sort((a, b) => b.pts - a.pts || parseInt(b.gd) - parseInt(a.gd));
      });
      return result;
    }

    function groupPlayerAwards(p) {
      // Group awards as "Pioneer Cup Golden Boot x3"
      const map = {};
      (p.awards || []).forEach(a => {
        const tourney = STATE.tournaments.find(t => t.meta.id === a.tourney);
        const eventName = tourney ? (tourney.meta.e || a.tourney) : a.tourney;
        const key = eventName + '|' + a.award;
        if (!map[key]) map[key] = { event: eventName, award: a.award, count: 0, ids: [] };
        map[key].count++;
        map[key].ids.push(a.tourney);
      });
      return Object.values(map).sort((a, b) => b.count - a.count || a.event.localeCompare(b.event));
    }

    function buildBracket(t) {
      const order = ['R64', 'R32', 'R16', 'QF', 'SF', '3P', 'F'];
      const labels = {
        R64: 'Round of 64', R32: 'Round of 32', R16: 'Round of 16',
        QF: 'Quarter-finals', SF: 'Semi-finals', '3P': 'Third Place', F: 'Final'
      };
      const byStage = {};
      t.m.forEach(m => {
        if (!m.stage || m.stage === 'GS') return;
        const s = m.stage === 'TP' ? '3P' : m.stage;
        if (!byStage[s]) byStage[s] = [];
        byStage[s].push(m);
      });
      const stages = order.filter(s => byStage[s] && byStage[s].length);
      if (!stages.length) return '';
      let html = `<div class="panel"><h2><i class="fa-solid fa-sitemap i"></i> Knockout Bracket</h2><div class="bracket">`;
      stages.forEach(s => {
        html += `<div class="bracket-round"><h4>${escapeHtml(labels[s] || s)}</h4>`;
        byStage[s].forEach(m => {
          const hn = t.n[m.home] ? t.n[m.home].name : m.home;
          const an = t.n[m.away] ? t.n[m.away].name : m.away;
          let score = `${m.sh}–${m.sa}`;
          if (m.p) score += ` (p ${m.p[0]}–${m.p[1]})`;
          if (m.et) score += ' ET';
          html += `<div class="bracket-match">
        <div>${escapeHtml(hn)}</div>
        <div class="score">${score}</div>
        <div>${escapeHtml(an)}</div>
      </div>`;

        html += `</div>`;
      });
      html += `</div></div>`;
      return html;
    }

    function renderRecords() {
      const players = Object.values(STATE.players);
      const teams = Object.values(STATE.teams);
      const tours = STATE.tournaments;

      // Most titles (players)
      const mostTitlesP = players.slice().sort((a, b) => b.titles - a.titles)[0];
      const mostTitlesT = teams.slice().sort((a, b) => b.titles - a.titles)[0];
      const mostGoals = players.slice().sort((a, b) => b.goals - a.goals)[0];
      const mostAwards = players.slice().sort((a, b) => b.awards.length - a.awards.length)[0];
      const mostRU = players.slice().sort((a, b) => b.runnerUps - a.runnerUps)[0];

      // Largest victory & highest scoring
      let largest = null, highScore = null;
      tours.forEach(t => {
        t.m.forEach(m => {
          const margin = Math.abs(m.sh - m.sa);
          const total = m.sh + m.sa;
          if (!largest || margin > largest.margin) {
            largest = { margin, match: m, tourney: t };
          }
          if (!highScore || total > highScore.total) {
            highScore = { total, match: m, tourney: t };
          }
        });
      });

      function matchLabel(m, t) {
        const hn = t.n[m.home] ? t.n[m.home].name : m.home;
        const an = t.n[m.away] ? t.n[m.away].name : m.away;
        return `${hn} ${m.sh}–${m.sa} ${an}`;
      }

      const curated = STATE.misc.records || [];

    function doSearch(q) {
      q = (q || '').trim().toLowerCase();
      const box = document.getElementById('search-results');
      if (!box) return;
      if (!q) { box.innerHTML = '<p class="empty">Enter a search term.</p>'; return; }

      const results = [];
      // players
      Object.values(STATE.players).forEach(p => {
        if (p.name.toLowerCase().includes(q)) {
          results.push({ type: 'Player', label: p.name, href: `#player/${encodeURIComponent(p.name)}` });
        }
      });
      // teams
      Object.values(STATE.teams).forEach(t => {
        if (t.name.toLowerCase().includes(q) || t.abbr.toLowerCase().includes(q)) {
          results.push({ type: 'Team', label: t.name, href: `#team/${encodeURIComponent(t.abbr)}` });
        }
      });
      // competitions
      STATE.tournaments.forEach(t => {
        if ((t.meta.e || '').toLowerCase().includes(q) || (t.meta.id || '').toLowerCase().includes(q) || (t.meta.s || '').toLowerCase().includes(q)) {
          results.push({ type: 'Competition', label: (t.meta.e || t.meta.id) + ' (' + (t.meta.s || '') + ')', href: `#competition/${encodeURIComponent(t.meta.id)}` });
        }
      });
      // awards
      STATE.tournaments.forEach(t => {
        Object.keys(t.aw).forEach(k => {
          const val = t.aw[k];
          if (val.toLowerCase().includes(q) || k.toLowerCase().includes(q)) {
            results.push({ type: 'Award', label: k + ' → ' + val + ' (' + t.meta.id + ')', href: `#competition/${encodeURIComponent(t.meta.id)}` });
          }
        });
      });

      if (!results.length) {
        box.innerHTML = '<p class="empty">No matches.</p>';
        return;
      }
      let html = `<table><thead><tr><th>Type</th><th>Result</th></tr></thead><tbody>`;
      results.slice(0, 40).forEach(r => {
        html += `<tr><td>${escapeHtml(r.type)}</td><td><a href="${r.href}">${escapeHtml(r.label)}</a></td></tr>`;
      });
      html += `</tbody></table>`;
      box.innerHTML = html;
    }

    function renderAbout() {
      const aboutText = (STATE.config && STATE.config.about) ? STATE.config.about : '';
      return `<h1><i class="fa-solid fa-circle-info i"></i>About CASPER</h1>

  <div class="panel">
    <h2>What is CASPER?</h2>
    <p>CASPER (Competitive Athletics &amp; Sports Promotion) is a local, offline archive and results viewer for a closed football competition system. It is not a live scores site and it does not connect to any external API. Everything you see is generated on your machine from plain-text archive files.</p>
    ${aboutText ? `<p>${escapeHtml(aboutText)}</p>` : ''}
    <p>The site is intentionally dense. Tables, standings, match reports, career pages and records are all derived automatically from the same source data so nothing has to be typed twice.</p>
  </div>

  <div class="panel">
    <h2>Why it exists</h2>
    <p>CASPER started as a way to keep a permanent, searchable record of every match, title and award without relying on spreadsheets that go missing or chat logs that scroll away. The goals are simple:</p>
    <ul>
      <li>One canonical place for results, careers and history</li>
      <li>Data that can still be read in ten years (plain text, no database server)</li>
      <li>A viewer that builds every page from the archive instead of hand-maintained HTML</li>
      <li>Enough detail for serious record-keeping without turning into a social network</li>
    </ul>
  </div>

  <div class="panel">
    <h2>Competition structure</h2>
    <p>A full CASPER season is built around a fixed pyramid of cups and leagues. The season always opens with the <b>Pioneer Cup</b> (12–16 clubs, group stage then knockout). From there the field splits:</p>
    <ul>
      <li><b>Top 8</b> → <b>Grande Cup</b> (direct knockout). Grande’s top four enter the <b>Premier League</b> (double round-robin); places 5–8 play the <b>Conference League</b> (single round-robin).</li>
      <li><b>Bottom 4–8</b> → <b>Relegator Cup</b> (direct knockout). Relegator entrants also play the <b>Peripheral Cup</b> (single RR). Peripheral champion vs Relegator champion = <b>Minor SuperCup</b>; that winner then meets the Conference champion in the <b>Sub SuperCup</b>.</li>
      <li><b>Super Cup</b> — Premier champion vs Grande champion.</li>
      <li><b>Finale</b> — the ultimate match of the season: Winner A (Pioneer Champion vs Grande Champion) against Winner B (Sub SuperCup Champion vs Premier Champion).</li>
    </ul>
    <p>Exact formats, number of teams and qualification rules can vary slightly by season; the archive records what actually happened. A full diagram is on the <a href="#structure">Structure</a> page.</p>
  </div>

  <div class="panel">
    <h2>CSN — the archive format</h2>
    <p>Every competition is stored in a compact text format called <b>CSN</b> (CASPER Season Notation). A single tournament is one square-bracket block. Inside the block you write key/value pairs and a few structured functions. A minimal example looks like this:</p>
    <pre class="csn-raw" style="max-height:none">[ id=pc26s1;
  e=Pioneer Cup; s=2026; ed=1; fmt=Groups+KO;
  dos=01032026; doc=15032026; sts=Completed; t=16;
  n( bbu=Blue Bulls[Alex], kok=Kokomo FC[Sam], ... );
  grp( A>bbu,kok,rft,mxp; B>... );
  m( bbu-kok:3-2#GS; kok-rft:1-1#GS; bbu-mxp:2-0(et)#SF; bbu-kok:1-0#F );
  aw( ch=bbu; ru=kok; gb=Alex );
  nt( First edition under the new pyramid. );
]</pre>
    <p>Key pieces:</p>
    <table class="kv-table">
      <tr><td><code>id</code></td><td>Unique tournament ID (used in URLs and cross-references)</td></tr>
      <tr><td><code>e</code> / <code>s</code></td><td>Event name and season label</td></tr>
      <tr><td><code>dos</code> / <code>doc</code></td><td>Start and end dates (DDMMYYYY)</td></tr>
      <tr><td><code>n(...)</code></td><td>Teams: <code>abbr=Full Name[Player]</code></td></tr>
      <tr><td><code>grp(...)</code></td><td>Group membership: <code>A&gt;team1,team2; B&gt;...</code></td></tr>
      <tr><td><code>m(...)</code></td><td>Matches: <code>home-away:goals-goals(extras)#STAGE</code></td></tr>
      <tr><td><code>aw(...)</code></td><td>Awards: <code>ch</code> champion, <code>ru</code> runner-up, plus custom codes</td></tr>
      <tr><td><code>st(...)</code></td><td>Optional explicit standings (otherwise calculated from group matches)</td></tr>
      <tr><td><code>nt</code> / <code>ac</code></td><td>Free-text notes and achievement tags</td></tr>
    </table>
    <p>Match extras inside parentheses can include <code>et</code> (extra time), <code>p2-1</code> (penalties), <code>y1-0</code> (yellow cards) and <code>r0-1</code> (red cards). Stage tags after <code>#</code> mark Final, SF, QF, R16, GS, etc. Full-line comments starting with <code>#</code> are ignored.</p>
    <p>The parser is pure JavaScript, runs in the browser, and turns every CSN block into the objects used for standings, brackets, player careers, ELO and records. No server is involved.</p>
  </div>

  <div class="panel">
    <h2>How the site is organised</h2>
    <table class="kv-table">
      <tr><td><code>config.json</code></td><td>Site title, tagline, theme colours, award labels, archive paths</td></tr>
      <tr><td><code>data/manifest.json</code></td><td>Ordered list of <code>.csn</code> files to load</td></tr>
      <tr><td><code>data/*.csn</code></td><td>Tournament archives (one or many files)</td></tr>
      <tr><td><code>misc.json</code></td><td>News, seasonal awards, curated records, season notes, pyramid trophies</td></tr>
      <tr><td><code>index.html</code></td><td>This viewer — HTML, CSS and vanilla JS only</td></tr>
      <tr><td><code>fill.html</code></td><td>Editor used to create and validate CSN + misc content</td></tr>
    </table>
    <p>On load the viewer fetches the manifest, parses every listed CSN file, builds player/team aggregates and ELO ratings, then routes by the URL hash (<code>#player/Name</code>, <code>#competition/id</code>, <code>#database</code>, etc.). All of that happens client-side.</p>
  </div>

  <div class="panel">
    <h2>What is calculated automatically</h2>
    <ul>
      <li>Group standings (when not supplied explicitly)</li>
      <li>Knockout brackets from stage-tagged matches</li>
      <li>Career totals for every player and team (goals, clean sheets, win rate, cards, titles…)</li>
      <li>ELO ratings (base 1500, K=32, chronological)</li>
      <li>Records (largest win, highest-scoring match, most titles, etc.)</li>
      <li>Season and competition-series summaries</li>
    </ul>
    <p>If a number appears on a page, it came from the archive or was derived from it. Nothing is simulated for display.</p>
  </div>

  <div class="panel">
    <h2>Technology</h2>
    <p>Single HTML file · CSS · vanilla JavaScript · Font Awesome icons. No frameworks, no build step, no backend, no analytics. Open the file (or serve the folder) and it runs. Designed to stay readable and editable by hand.</p>
  </div>

  <div class="panel">
    <h2>Editing the archive</h2>
    <p>Use <a href="fill.html">fill.html</a> to create new tournaments, edit existing CSN, validate syntax and maintain news / seasonal awards / records in <code>misc.json</code>. After saving files into <code>data/</code> and updating the manifest, reload this page.</p>
  </div>

  <div class="panel">
    <div class="section-title"><i class="fa-solid fa-diagram-project i"></i>Competition pyramid</div>
    ${renderPyramid()}
  </div>`;

    function renderDatabase() {
      const players = Object.values(STATE.players);
      const teams = Object.values(STATE.teams);
      const tours = STATE.tournaments;
      const matches = STATE.matches;
      const totalGoals = players.reduce((s, p) => s + p.goals, 0);
      const totalAwards = players.reduce((s, p) => s + p.awards.length, 0) + (STATE.misc.seasonalAwards || []).length;
      const curatedRecords = (STATE.misc.records || []).length;
      const totalRecords = curatedRecords + 14;
      const seasons = [...new Set(tours.map(t => t.meta.s).filter(Boolean))];
      const newsCount = (STATE.misc.news || []).length;
      const objects = tours.length + matches.length + players.length + teams.length +
        totalAwards + totalRecords + newsCount + seasons.length + Object.keys(STATE.rawById).length;
      const fmt = n => (n == null ? '—' : Number(n).toLocaleString('en-US'));
      const rows = [
        { k: 'Database Version', v: STATE.metrics.databaseVersion || '2026.08' },
        { k: 'Database Size', v: fmt(STATE.metrics.bytes) + ' bytes' },
        { k: 'CSN Version', v: STATE.metrics.csnVersion || '1.2' },
        { k: 'Objects', v: fmt(objects) },
        { k: 'Competitions', v: fmt(tours.length) },
        { k: 'Matches', v: fmt(matches.length) },
        { k: 'Goals', v: fmt(totalGoals) },
        { k: 'Players', v: fmt(players.length) },
        { k: 'Teams', v: fmt(teams.length) },
        { k: 'Awards', v: fmt(totalAwards) },
        { k: 'Records', v: fmt(totalRecords) },
        { k: 'Seasons', v: fmt(seasons.length) },
        { k: 'News items', v: fmt(newsCount) },
        { k: 'Characters', v: fmt(STATE.metrics.characters) },
        { k: 'Bytes', v: fmt(STATE.metrics.bytes) },
        { k: 'Lines', v: fmt(STATE.metrics.lines) },
        { k: 'Archive sources', v: fmt(STATE.metrics.loadSources) },
        { k: 'Parse Time (ms)', v: STATE.metrics.parseTimeMs },
        { k: 'Render Time (ms)', v: STATE.metrics.renderTimeMs },
        { k: 'ELO base', v: '1500' },
        { k: 'ELO K-factor', v: '32' }
      ];
      let html = `<h1><i class="fa-solid fa-database i"></i>Database</h1>
  <p class="muted" style="margin-bottom:10px">Live metrics from the loaded archives, config and misc data. Nothing here is simulated.</p>
  <div class="panel">
    <pre class="csn-raw" style="max-height:none;font-size:13px;line-height:1.55">`;
      rows.forEach(r => {
        const dots = '.'.repeat(Math.max(2, 22 - r.k.length));
        html += `${escapeHtml(r.k)}${dots} ${escapeHtml(String(r.v))}\n`;

      html += `</pre>
  </div>
  <div class="split-3">
    <div class="panel">

        <tr><td>Teams</td><td class="accent">${fmt(teams.length)}</td></tr>
        <tr><td>Awards</td><td class="accent">${fmt(totalAwards)}</td></tr>
        <tr><td>Records</td><td class="accent">${fmt(totalRecords)}</td></tr>
        <tr><td>Seasons</td><td class="accent">${fmt(seasons.length)}</td></tr>
        <tr><td>News</td><td class="accent">${fmt(newsCount)}</td></tr>
        <tr><td><b>Total objects</b></td><td class="accent"><b>${fmt(objects)}</b></td></tr>

    </div>
    <div class="panel">

        <tr><td>CSN sources</td><td class="accent">${fmt(STATE.metrics.loadSources)}</td></tr>

    function renderMatch(param) {
      // param: tourneyId/index
      const parts = decodeURIComponent(param).split('/');
      const tid = parts[0];
      const idx = parseInt(parts[1], 10);
      const m = STATE.matches.find(x => x.tourneyId === tid && x.index === idx);
      if (!m) return `<div class="error">Match not found.</div>`;
      const t = STATE.tournaments.find(x => x.meta.id === tid);
      const total = m.sh + m.sa;
      const margin = Math.abs(m.sh - m.sa);
      let result = 'Draw';
      if (m.homeWin) result = escapeHtml(m.homeName) + ' win';
      if (m.awayWin) result = escapeHtml(m.awayName) + ' win';

      let html = `<a class="back" href="#competition/${encodeURIComponent(tid)}"><i class="fa-solid fa-arrow-left"></i> ${escapeHtml(m.event || tid)}</a>
  <h1><i class="fa-solid fa-futbol i"></i>Match Report</h1>
  <div class="panel" style="text-align:center">
    <div class="muted" style="font-family:sans-serif;font-size:12px;margin-bottom:8px">
      ${escapeHtml(m.event || '')} · ${escapeHtml(m.season || '')}
      ${m.stage ? ' · <span class="stage-tag">' + escapeHtml(m.stage) + '</span> ' + escapeHtml(m.stageLabel || '') : ''}
    </div>
    <div style="display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;font-family:sans-serif">
      <div style="text-align:center;min-width:140px">
        <div style="font-size:13px"><a href="#team/${encodeURIComponent(m.home)}">${escapeHtml(m.homeName)}</a></div>
        <div style="font-size:12px;color:#54595d">${m.homePlayer ? '<a href="#player/' + encodeURIComponent(m.homePlayer) + '">' + escapeHtml(m.homePlayer) + '</a>' : ''}</div>
      </div>
      <div style="font-size:36px;font-weight:bold;font-family:sans-serif">${m.sh} – ${m.sa}</div>

    <div class="cell"><span class="n">${m.et ? 'Yes' : 'No'}</span><span class="l">Extra time</span></div>

  </div>
  <div class="grid2">

      <table class="kv-table">
        <tr><td>Competition</td><td><a href="#competition/${encodeURIComponent(tid)}">${escapeHtml(m.event || tid)}</a></td></tr>
        <tr><td>Season</td><td><a href="#season/${encodeURIComponent(m.season || '')}">${escapeHtml(m.season || '—')}</a></td></tr>
        <tr><td>Stage</td><td>${m.stage ? escapeHtml(m.stageLabel || m.stage) : '—'}</td></tr>
        <tr><td>Score (FT)</td><td><b>${m.sh}–${m.sa}</b></td></tr>
        <tr><td>Result</td><td>${result}</td></tr>
        <tr><td>Total goals</td><td>${total}</td></tr>

        <tr><td>Clean sheet</td><td>${m.sa === 0 ? escapeHtml(m.homeName) : (m.sh === 0 ? escapeHtml(m.awayName) : 'Neither')}</td></tr>

    <div class="panel">

      <table>
        <thead><tr><th></th><th>Home</th><th>Away</th></tr></thead>
        <tbody>
          <tr><td>Team</td>
            <td><a href="#team/${encodeURIComponent(m.home)}">${escapeHtml(m.homeName)}</a></td>
            <td><a href="#team/${encodeURIComponent(m.away)}">${escapeHtml(m.awayName)}</a></td></tr>
          <tr><td>Player</td>
            <td>${m.homePlayer ? '<a href="#player/' + encodeURIComponent(m.homePlayer) + '">' + escapeHtml(m.homePlayer) + '</a>' : '—'}</td>

          <tr><td>Red</td><td>${m.r ? m.r[0] : 0}</td><td>${m.r ? m.r[1] : 0}</td></tr>
          <tr><td>Pens</td><td>${m.p ? m.p[0] : '—'}</td><td>${m.p ? m.p[1] : '—'}</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;

      // Related matches in same tournament
      if (t) {
        html += `<div class="panel"><div class="section-title"><i class="fa-solid fa-list i"></i>Other matches in ${escapeHtml(m.event || tid)}</div>
    <table><thead><tr><th>#</th><th>Stage</th><th>Match</th><th>Score</th></tr></thead><tbody>`;
        t.m.forEach((om, oi) => {
