<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASPER Futsal — Archive</title>
  <style>
    body { font-family: sans-serif; margin: 40px; color: #202122; }
    .sport-switch { display:flex; gap:6px; flex-wrap:wrap; font-size:12px; margin: 8px 0; }
    .sport-switch a { border:1px solid #c8ccd1; background:#f8f9fa; color:#202122 !important; padding:3px 10px; border-radius:999px; text-decoration:none !important; }
    .sport-switch a.on { background:#202122; color:#fff !important; border-color:#202122; font-weight:bold; }
  </style>
</head>
<body>
  <p>Loading CASPER Futsal archive…</p>
  <script>
    const ARCHIVE = 'https://raw.githubusercontent.com/Anish-C2/CASPER-Futsal/b099ee982c12a39de9bfeba4d5f23c587db58172/index.html';
    const SWITCH = '<div class="sport-switch"><a href="index.html">CASPER</a><a href="futsal.html" class="on">Futsal</a><a href="football.html">Football</a><a href="cricket.html">Cricket</a></div>';
    const SWITCH_CSS = '.sport-switch{max-width:1100px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;flex-wrap:wrap;font-family:sans-serif;font-size:12px}.sport-switch a{border:1px solid #c8ccd1;background:#f8f9fa;color:#202122 !important;padding:3px 10px;border-radius:999px;text-decoration:none !important}.sport-switch a.on{background:#202122;color:#fff !important;border-color:#202122;font-weight:bold}';
    fetch(ARCHIVE).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(html => {
      html = html.replace('<title>CASPER Futsal \u2014 Competitive Athletics & Sports Promotion</title>', '<title>CASPER Futsal \u2014 Archive</title>');
      html = html.replace('CASPER Futsal\n        <span class="tag"', '<a href="index.html" style="color:inherit;text-decoration:none">CASPER</a> Futsal\n        <span class="tag"');
      html = html.replace('    </div>\n    <div class="address-bar-wrap">', '    </div>\n    ' + SWITCH + '\n    <div class="address-bar-wrap">');
      html = html.replace('  </style>', SWITCH_CSS + '\n  </style>');
      html = html.replace('CASPER Futsal \u2014 Competitive Athletics &amp; Sports Promotion \u00b7 CSN-powered', '<a href="index.html">CASPER</a> \u00b7 Futsal archive \u00b7 CSN-powered');
      document.open(); document.write(html); document.close();
    }).catch(err => {
      document.body.innerHTML = '<h1>CASPER Futsal</h1><p>Could not load the archive automatically.</p><p><a href="index.html">Back to CASPER</a></p><pre>' + String(err) + '</pre>';
    });
  </script>
</body>
</html>
