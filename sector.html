<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASPER — Sector</title><link rel="stylesheet" href="assets/css/casper.css?v=20260901h"><link rel="stylesheet" href="assets/css/casper-desktop.css?v=20260901h"><style>.sector-banner{border:1px solid #444;background:#1a1a1a;padding:22px;margin:18px 0}.sector-code{font:700 12px Georgia,serif;letter-spacing:2px;color:#c89b3c}.sector-banner h2{margin:5px 0}.sector-type{color:#999;text-transform:uppercase;font-size:11px;letter-spacing:1.5px}.sector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.sector-box{border:1px solid #444;background:#171717;padding:18px}.sector-box b{display:block;font-size:24px}.sector-box span{color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px}.sector-section{border-top:1px solid #444;margin-top:20px;padding-top:18px}.muted{color:#999}.back{color:#c89b3c;text-decoration:none;font-size:11px;text-transform:uppercase;letter-spacing:1px}</style></head><body><header><div class="topbar"><div class="brand"><div class="crest">CA</div><div><h1>CASPER</h1><div class="sub">Competitive Athletics &amp; Sports Promotion</div><div class="legacy">One Association. Three Sports. Infinite Legacy.</div></div></div></div><div class="pills"><a href="index.html">CASPER</a><a href="futsal.html">Futsal</a><a href="football.html">Football</a><a href="cricket.html">Cricket</a></div><nav class="main"><ul><li><a href="index.html">Home</a></li><li><a class="on" href="sectors.html">Sectors</a></li><li><a href="api/index.html">API</a></li></ul></nav></header><main id="app"><div class="desktop-page" id="sector-view"><div class="desktop-hero"><div><div class="desktop-kicker">CASPER SECTOR</div><h2>LOADING SECTOR…</h2><p>Loading local competitive ecosystem.</p></div></div></div></main><footer class="site"><div>© 2026 CASPER — Competitive Athletics &amp; Sports Promotion</div><div>Sector archive</div></footer><script>fetch('sectors.json').then(function(r){return r.json()}).then(function(d){var id=new URLSearchParams(location.search).get('id'),s=(d.sectors||[]).find(function(x){return x.id===id})||d.sectors&&d.sectors[0];var v=document.getElementById('sector-view');if(!s){v.innerHTML='<div class="sector-banner"><h2>Sector not found</h2><a class="back" href="sectors.html">← Sector Directory</a></div>';return}var l=(s.leagues||[]),se=(s.seasons||[]),p=(s.playerIds||[]),c=(s.clubCodes||[]);v.innerHTML='<div class="desktop-hero"><div><div class="desktop-kicker">'+s.code+'</div><h2>'+s.name+'</h2><p>'+s.type+' · '+s.status+'</p></div></div><div class="sector-banner"><div class="sector-code">'+s.code+'</div><h2>'+s.name+'</h2><div class="sector-type">'+s.type+'</div><p>'+s.description+'</p><a class="back" href="sectors.html">← Sector Directory</a></div><div class="sector-grid"><div class="sector-box"><b>'+l.length+'</b><span>Leagues</span></div><div class="sector-box"><b>'+se.length+'</b><span>Seasons</span></div><div class="sector-box"><b>'+p.length+'</b><span>Players</span></div><div class="sector-box"><b>'+c.length+'</b><span>Clubs</span></div></div><div class="sector-section"><h2>Sports</h2><p class="muted">'+((s.sports||[]).join(' · ')||'No sports configured')+'</p></div><div class="sector-section"><h2>League System</h2><p class="muted">'+(l.length?l.map(function(x){return x.name}).join(' · '):'No leagues registered yet.')+'</p></div><div class="sector-section"><h2>Archive</h2><p class="muted">'+se.length+' season(s) · '+p.length+' registered player(s) · '+c.length+' registered club(s)</p></div>'}).catch(function(){document.getElementById('sector-view').innerHTML='<div class="sector-banner"><h2>Sector registry unavailable</h2></div>'});</script></body></html>
