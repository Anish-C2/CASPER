name: Update GitHub clone history

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CASPER
        uses: actions/checkout@v4

      - name: Update clone history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/github-clones.js

      - name: Commit clone history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github-clones.json
          git diff --cached --quiet || git commit -m 'Update GitHub clone history'
          git push
