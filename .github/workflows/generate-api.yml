name: Generate CASPER API

on:
  push:
    paths:
      - 'data/**/*.csn'
      - 'scripts/generate_api.py'
      - '.github/workflows/generate-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate API JSON
        run: python scripts/generate_api.py

      - name: Commit generated API
        uses: EndBug/add-and-commit@v9
        with:
          add: 'api/v1'
          message: 'chore: regenerate CASPER API from CSN archives'
